{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mingadocs{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'arnlabels/app.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="{% url 'arnlabels:index' %}">
        <span class="dot"></span> mingadocs
      </a>
      <nav>
        <a href="{% url 'arnlabels:index' %}"
           class="{% if nav == 'index' %}active{% endif %}">Overview</a>
        <a href="{% url 'arnlabels:label-utility' %}"
           class="{% if nav == 'labels' %}active{% endif %}">Print labels</a>
        <a href="{% url 'arnlabels:print-settings' %}"
           class="{% if nav == 'settings' %}active{% endif %}">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    {% if messages %}
      <ul class="messages">
        {% for m in messages %}
          <li class="{{ m.tags }}">{{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
  // Bespoke -/+ stepper controls for every number input.
  document.querySelectorAll('input[type=number]').forEach(function (input) {
    if (input.dataset.stepper) { return; }
    input.dataset.stepper = '1';

    var wrap = document.createElement('span');
    wrap.className = 'stepper';
    input.parentNode.insertBefore(wrap, input);

    function mkBtn(cls, label, sign) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = cls;
      b.textContent = sign;
      b.setAttribute('aria-label', label);
      return b;
    }
    var dec = mkBtn('dec', 'Decrease', '−');
    var inc = mkBtn('inc', 'Increase', '+');
    wrap.appendChild(dec);
    wrap.appendChild(input);
    wrap.appendChild(inc);

    function bump(up) {
      if (input.value === '') {
        input.value = input.min !== '' ? input.min : 0;
      }
      try { up ? input.stepUp() : input.stepDown(); } catch (e) { /* clamp */ }
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    dec.addEventListener('click', function () { bump(false); });
    inc.addEventListener('click', function () { bump(true); });
  });
  </script>
</body>
</html>
