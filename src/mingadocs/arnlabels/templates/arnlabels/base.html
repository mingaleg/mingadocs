<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ARN Labels{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'arnlabels:label-utility' %}">Print labels</a> |
    <a href="{% url 'arnlabels:print-settings' %}">Settings</a>
  </nav>
  {% if messages %}
    <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
