[project]
name = "mingadocs"
version = "0.1.0"
description = ""
authors = [
    {name = "Oleg Mingalev",email = "oleg@mingalev.net"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "django (>=5.1)",
    "pycups (>=2.0.4,<3.0.0)",
    "reportlab (>=5.0.1,<6.0.0)",
    "django-solo (>=2.5.1,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "zxing-cpp (>=3.1.1,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "django-stubs-ext (>=6.1.0,<7.0.0)",
    "pypdfium2 (>=5.13.0,<6.0.0)"
]

[tool.poetry]
# Application, not a distributable library: don't install the project itself.
package-mode = false

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "pylint (>=4.0.7,<5.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "django-stubs (>=6.1.0,<7.0.0)",
    "pylint-django (>=2.8.0,<3.0.0)",
    "ruff (>=0.16.5,<0.17.0)"
]

# --------------------------------------------------------------------------
# Static analysis. Run all three with `make lint` (or individually:
# `make mypy` / `make pylint` / `make bandit`). The source root lives under
# src/mingadocs/, so every tool is pointed there and told where Django's
# settings module is.
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
mypy_path = "src/mingadocs:stubs"
explicit_package_bases = true
namespace_packages = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
strict_equality = true
extra_checks = true
exclude = ['/migrations/', '/manage\.py$']

[[tool.mypy.overrides]]
# Tests exercise a lot of Django / 3rd-party surface; keep them type-checked but
# do not demand full annotations or ban Any on every fixture helper.
module = ["*.tests", "*.test_actual_docs"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_explicit = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# pypdfium2 ships no type stubs / py.typed marker.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"
init-hook = "import sys; sys.path.insert(0, 'src/mingadocs')"
ignore = ["migrations"]
extension-pkg-allow-list = ["cups", "zxingcpp"]
jobs = 0

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "x", "y", "c", "im", "ex", "fh", "fd", "fn", "r", "a", "b", "e"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "duplicate-code",
    "import-outside-toplevel",
    # Deliberate: several handlers catch Exception to degrade gracefully / never
    # break request handling. Each is marked with `# noqa: BLE001` at the site.
    "broad-exception-caught",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-attributes = 20
max-locals = 20

[tool.bandit]
exclude_dirs = ["src/mingadocs/tests", "tools"]
# B101 assert: only used in tests. B404/B603: subprocess use is deliberate and
# argument lists are fully controlled (see scans/scanner.py).
skips = ["B101", "B404"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src/mingadocs"]
# Auto-generated; mypy skips them too.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "BLE",           # flake8-blind-except
    "C4",            # flake8-comprehensions
    "DJ",            # flake8-django
    "DTZ",           # flake8-datetimez
    "EXE",           # flake8-executable
    "G",             # flake8-logging-format
    "ISC",           # implicit-str-concat
    "LOG",           # flake8-logging
    "PIE",           # flake8-pie
    "RET",           # flake8-return
    "RSE",           # flake8-raise
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
# Security lint is bandit's job (see [tool.bandit]); do not double up here.

[tool.ruff.lint.isort]
known-first-party = ["arnlabels", "scans", "siteconfig", "config"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Django's config-by-class-attribute style (Meta, list_display, fields, …)
# trips RUF012 everywhere and is not a real bug there.
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
# Hand-written stubs must mirror the upstream libraries' (camelCase) API.
"stubs/**" = ["N802", "N803"]
